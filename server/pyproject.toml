[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nortadesyco-api"
version = "1.0.0"
description = "Backend for nortadesyco.xyz — relays the consultation form to email."
requires-python = ">=3.12"
dependencies = [
    # fastapi/starlette floors clear Starlette CVE-2025-54121 / -62727.
    # Pin the resolved versions after a test install + pip-audit.
    "fastapi>=0.119.0",
    "starlette>=0.49.1",
    "uvicorn[standard]==0.34.0",
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
